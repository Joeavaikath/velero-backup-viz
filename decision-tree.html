<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velero — Volume Decision Tree</title>
<style>
:root {
  --bg: #0f1117; --surface: #161922; --surface-hover: #1e2130;
  --border: #282c3a; --text: #e1e4ed; --text-muted: #7a7f92; --text-dim: #4e5264;
  --green: #4ade80; --green-dim: #16503a;
  --red: #f87171; --red-dim: #5c1e1e;
  --blue: #6c8cff; --blue-dim: #2a3766;
  --purple: #c084fc; --purple-dim: #3d2266;
  --orange: #fb923c; --orange-dim: #4d2e12;
  --cyan: #22d3ee; --cyan-dim: #0c3d47;
  --yellow: #facc15; --yellow-dim: #5c4d10;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}

nav{height:44px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--border);gap:6px;flex-shrink:0}
.nav-tab{font-size:12px;padding:6px 14px;border-radius:6px;text-decoration:none;color:var(--text-muted);border:1px solid transparent;transition:all .15s}
.nav-tab:hover{color:var(--text);background:var(--surface)}
.nav-tab.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
nav .title{font-size:14px;font-weight:600;margin-right:16px}

.canvas{flex:1;overflow:auto;position:relative;padding:24px}

/* ── Tree layout ── */
.tree{display:flex;flex-direction:column;align-items:center;padding-bottom:60px}
.node-wrap{display:flex;flex-direction:column;align-items:center}
.branch-wrap{display:flex;justify-content:center;gap:0;position:relative}
.branch-arm{display:flex;flex-direction:column;align-items:center;padding:0 8px}

/* Connector lines */
.vline{width:2px;background:var(--border);transition:background .3s}
.vline.on{background:var(--green)}
.hline-container{display:flex;align-items:flex-start;width:100%;position:relative;justify-content:center}
.hline{height:2px;background:var(--border);transition:background .3s}
.hline.on{background:var(--green)}

/* ── Nodes ── */
.node{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;min-width:180px;max-width:240px;text-align:center;
  cursor:default;transition:all .2s;position:relative;
}
.node:hover{border-color:var(--text-dim);background:var(--surface-hover)}
.node.dimmed{opacity:.2;pointer-events:none}
.node.highlighted{border-color:var(--green);box-shadow:0 0 12px rgba(74,222,128,.12)}

.node-tag{
  font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:6px;
}
.node-tag.q{background:var(--blue-dim);color:var(--blue)}
.node-tag.out{background:var(--green-dim);color:var(--green)}
.node-tag.skip{background:var(--red-dim);color:var(--red)}
.node-tag.fsb{background:var(--cyan-dim);color:var(--cyan)}
.node-tag.csi{background:var(--blue-dim);color:var(--blue)}
.node-tag.dm{background:var(--purple-dim);color:var(--purple)}
.node-tag.native{background:var(--orange-dim);color:var(--orange)}

.node-title{font-size:12px;font-weight:500;line-height:1.3}
.node-sub{font-size:10px;color:var(--text-dim);line-height:1.3;margin-top:3px}

/* Outcome nodes */
.node.outcome{border-width:2px}
.node.outcome.fsb{border-color:var(--cyan-dim)}
.node.outcome.csi{border-color:var(--blue-dim)}
.node.outcome.dm{border-color:var(--purple-dim)}
.node.outcome.native{border-color:var(--orange-dim)}
.node.outcome.skip{border-color:var(--red-dim)}

/* ── Toggle switches ── */
.toggle-row{display:flex;align-items:center;justify-content:center;gap:0;margin:4px 0}
.toggle-btn{
  font-size:10px;font-weight:600;padding:3px 12px;cursor:pointer;
  border:1px solid var(--border);transition:all .15s;font-family:inherit;
  background:var(--bg);color:var(--text-dim);
}
.toggle-btn:first-child{border-radius:4px 0 0 4px}
.toggle-btn:last-child{border-radius:0 4px 4px 0}
.toggle-btn:not(:first-child){border-left:none}
.toggle-btn:hover{color:var(--text);background:var(--surface-hover)}
.toggle-btn.yes.active{background:var(--green-dim);color:var(--green);border-color:var(--green-dim)}
.toggle-btn.no.active{background:var(--red-dim);color:var(--red);border-color:var(--red-dim)}
.toggle-btn.choice.active{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-dim)}

/* ── Tooltip ── */
.tooltip{
  position:fixed;z-index:1000;pointer-events:none;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px 18px;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.5);
  opacity:0;transition:opacity .15s;
}
.tooltip.show{opacity:1}
.tooltip h4{font-size:13px;font-weight:600;margin-bottom:6px}
.tooltip p{font-size:11px;color:var(--text-muted);line-height:1.5;margin-bottom:6px}
.tooltip .tt-file{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--blue);margin-bottom:6px}
.tooltip .tt-code{
  font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--bg);
  border:1px solid var(--border);border-radius:5px;padding:8px 10px;
  white-space:pre;overflow-x:auto;color:var(--text-dim);line-height:1.4;
  max-height:140px;max-width:340px;
}

/* ── Bottom bar ── */
.bottom-bar{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:6px 14px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.5);
  font-size:12px;color:var(--text-muted);
}
.bottom-bar button{
  background:transparent;border:1px solid var(--border);color:var(--text-muted);
  font-size:11px;padding:5px 14px;border-radius:5px;cursor:pointer;font-family:inherit;
}
.bottom-bar button:hover{background:var(--surface-hover);color:var(--text)}
.bottom-bar .sep{width:1px;height:20px;background:var(--border)}
.path-label{font-size:11px;min-width:200px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<nav>
  <span class="title">Velero Backup</span>
  <a class="nav-tab" href="index.html">Overview</a>
  <a class="nav-tab" href="flow.html">Controller Flow</a>
  <a class="nav-tab active" href="decision-tree.html">Volume Decision Tree</a>
  <a class="nav-tab" href="timeline.html">Timeline</a>
</nav>

<div class="canvas" id="canvas"></div>
<div class="tooltip" id="tooltip"></div>

<div class="bottom-bar">
  <span class="path-label" id="pathLabel">Toggle switches to trace a path</span>
  <div class="sep"></div>
  <button onclick="resetAll()">Reset All</button>
</div>

<script>
// ─── TREE DATA ───
// Recursive structure. Each node has id, title, sub, detail, file, code.
// Branch nodes have `branches` array with {label, child} entries.
// Leaf nodes have `outcome` with {type, title, sub}.
const TREE = {
  id:'policy', title:'ResourcePolicy configured?',
  sub:'BackupSpec.ResourcePolicy → ConfigMap',
  detail:'Volume policies have the highest priority. If a matching policy is found, its action overrides all annotation-based and default logic. Policies are defined in a ConfigMap referenced by the backup spec.',
  file:'internal/volumehelper/volume_policy_helper.go:126',
  code:`action := v.volumePolicy.GetMatchAction(volumeData)
if action.Type == Snapshot { return true }
if action.Type != "" { return false }
// no match → fall through to legacy...`,
  branches:[
    {label:'Yes', child:{
      id:'policy-match', title:'Policy rule matches volume?',
      sub:'First-match wins across all rules',
      detail:'Policies are evaluated in order — all conditions in a rule must match (storageClass, capacity, CSI driver, pvcLabels, volumeType). The first matching policy determines the action.',
      file:'internal/resourcepolicies/resource_policies.go:326',
      code:`# volumePolicy example:
- conditions:
    storageClass: ["gp3-csi"]
    capacity: "10Gi,500Gi"
  action:
    type: snapshot`,
      branches:[
        {label:'Yes', child:{
          id:'policy-action', title:'Policy action type?',
          sub:'Action overrides all other logic',
          detail:'Four possible actions. "snapshot" routes to CSI or native path. "fs-backup" forces Kopia. "skip" means no protection. "custom" defers to an external plugin.',
          file:'internal/resourcepolicies/resource_policies.go:40-51',
          branches:[
            {label:'snapshot', child:{
              id:'policy-snap-csi', title:'PV is CSI-backed + EnableCSI?',
              sub:'Determines CSI vs native path',
              detail:'When a policy forces "snapshot", the system still decides between CSI and native based on PV type and feature flags.',
              file:'backup/item_backupper.go:604',
              branches:[
                {label:'Yes', child:{
                  id:'policy-snap-move', title:'SnapshotMoveData = true?',
                  sub:'Move data to BSL via Kopia?',
                  detail:'Controls whether the CSI snapshot stays in-cluster or is uploaded to the backup storage location via a DataUpload CR and Kopia.',
                  file:'pkg/backup/actions/csi/pvc_action.go:375',
                  branches:[
                    {label:'Yes', child:{id:'out-dm-policy', outcome:{type:'dm', title:'CSI + Data Mover', sub:'VolumeSnapshot → DataUpload → Kopia → BSL. Async. Portable across clusters.'}}},
                    {label:'No', child:{id:'out-csi-policy', outcome:{type:'csi', title:'CSI Snapshot (In-Cluster)', sub:'VolumeSnapshot + VSC saved in tar. NOT portable — snapshot must exist in target cluster.'}}}
                  ]
                }},
                {label:'No', child:{id:'out-native-policy', outcome:{type:'native', title:'Native Cloud Snapshot', sub:'VolumeSnapshotter plugin (AWS EBS, GCP PD, Azure) calls cloud API.'}}}
              ]
            }},
            {label:'fs-backup', child:{id:'out-fsb-policy', outcome:{type:'fsb', title:'Kopia FSB (Policy)', sub:'Policy forces FSB. PodVolumeBackup CR created. Node-agent runs Kopia.'}}},
            {label:'skip', child:{id:'out-skip-policy', outcome:{type:'skip', title:'Skipped (Policy)', sub:'Policy explicitly skips this volume. No data protection.'}}},
            {label:'custom', child:{id:'out-custom', outcome:{type:'native', title:'Custom Plugin', sub:'External BIA plugin handles volume (e.g., vSphere).'}}}
          ]
        }},
        {label:'No match', child:null} // falls through — handled by ref below
      ]
    }},
    {label:'No', child:null} // falls through
  ]
};

// The "no policy" / "no match" subtree (legacy path)
const LEGACY = {
  id:'resource-type', title:'Resource type being processed?',
  sub:'Volume handling differs per GVR',
  detail:'The backup engine processes items by GroupVersionResource. Pods trigger FSB checks first, PVCs trigger CSI snapshot logic, PVs trigger native VolumeSnapshotter.',
  file:'backup/item_backupper.go:234-310',
  branches:[
    {label:'Pod', child:{
      id:'default-fsb', title:'DefaultVolumesToFsBackup = true?',
      sub:'Server flag or BackupSpec field',
      detail:'Controls opt-in vs opt-out paradigm. When true: all eligible volumes get FSB unless excluded. When false (default): only volumes listed in the opt-in annotation get FSB.',
      file:'internal/volumehelper/volume_policy_helper.go:291',
      code:`if !defaultVolumesToFsBackup {
  return volumeIsInOptInAnnotation(vol)
}
return !volumeIsInExcludeAnnotation(vol)`,
      branches:[
        {label:'Yes', child:{
          id:'exclude-check', title:'Volume in exclude annotation?',
          sub:'backup.velero.io/backup-volumes-excludes',
          detail:'When DefaultVolumesToFsBackup=true (opt-out mode), this annotation lists volume names to exclude from FSB.',
          file:'pkg/util/podvolume/pod_volume.go:247',
          branches:[
            {label:'Yes', child:{id:'out-skip-excluded', outcome:{type:'skip', title:'FSB Excluded', sub:'Volume explicitly excluded. May still get snapshot via PVC/PV path.'}}},
            {label:'No', child:{
              id:'vol-eligible-1', title:'Volume type eligible?',
              sub:'Excludes HostPath, Secret, ConfigMap...',
              detail:'HostPath, Secret, ConfigMap, Projected, DownwardAPI, and default-token volumes are never FSB-eligible.',
              file:'internal/volumehelper/volume_policy_helper.go:433',
              branches:[
                {label:'Yes', child:{id:'out-fsb-optout', outcome:{type:'fsb', title:'Kopia FSB', sub:'Opted in by default. PodVolumeBackup CR created. Kopia copies files to BSL.'}}},
                {label:'No', child:{id:'out-skip-type', outcome:{type:'skip', title:'Ineligible Type', sub:'HostPath, Secret, ConfigMap etc. cannot be file-system backed up.'}}}
              ]
            }}
          ]
        }},
        {label:'No', child:{
          id:'optin-check', title:'Volume in opt-in annotation?',
          sub:'backup.velero.io/backup-volumes',
          detail:'When DefaultVolumesToFsBackup=false (default), only volumes explicitly listed in this annotation get FSB.',
          file:'pkg/util/podvolume/pod_volume.go:233',
          branches:[
            {label:'Yes', child:{
              id:'vol-eligible-2', title:'Volume type eligible?',
              sub:'Excludes HostPath, Secret, ConfigMap...',
              detail:'Same eligibility check as above.',
              file:'internal/volumehelper/volume_policy_helper.go:433',
              branches:[
                {label:'Yes', child:{id:'out-fsb-optin', outcome:{type:'fsb', title:'Kopia FSB', sub:'Explicitly opted in via annotation. PodVolumeBackup CR created.'}}},
                {label:'No', child:{id:'out-skip-type-2', outcome:{type:'skip', title:'Ineligible Type', sub:'Volume type not supported for FSB.'}}}
              ]
            }},
            {label:'No', child:{id:'out-no-fsb', outcome:{type:'skip', title:'Not Opted In', sub:'Not in annotation, DefaultVolumesToFsBackup=false. May still get snapshot via PVC/PV.'}}}
          ]
        }}
      ]
    }},
    {label:'PVC', child:{
      id:'csi-enabled', title:'EnableCSI = true?',
      sub:'Feature gate for CSI BIA plugin',
      detail:'If EnableCSI is not set, the entire CSI snapshot path is skipped. The PVC is still backed up as metadata.',
      file:'pkg/util/csi/util.go:30',
      branches:[
        {label:'Yes', child:{
          id:'pv-is-csi', title:'PV is CSI-backed?',
          sub:'pv.Spec.CSI != nil',
          detail:'CSI BIA checks whether the underlying PV has a CSI volume source. Non-CSI PVs get SkippedNoCSIPVAnnotation.',
          file:'pkg/backup/actions/csi/pvc_action.go:306',
          branches:[
            {label:'Yes', child:{
              id:'snap-move', title:'SnapshotMoveData = true?',
              sub:'Upload to BSL via Kopia?',
              detail:'When true: VolumeSnapshot is transient, data uploaded via DataUpload+Kopia. When false: VolumeSnapshot + VSC saved in backup tar.',
              file:'pkg/backup/actions/csi/pvc_action.go:375',
              code:`if boolptr.IsSetToTrue(backup.Spec.SnapshotMoveData) {
  du := newDataUpload(backup, pvc, vs, ...)
} else {
  additionalItems = append(additionalItems, vsRef)
}`,
              branches:[
                {label:'Yes', child:{id:'out-dm', outcome:{type:'dm', title:'CSI + Data Mover', sub:'VolumeSnapshot → DataUpload → Kopia → BSL. Async. Portable.'}}},
                {label:'No', child:{id:'out-csi-local', outcome:{type:'csi', title:'CSI Snapshot (In-Cluster)', sub:'VS + VSC in tar. Not portable.'}}}
              ]
            }},
            {label:'No', child:{id:'out-no-csi-pv', outcome:{type:'skip', title:'Not CSI-Backed', sub:'PV is in-tree (NFS, EBS legacy). Falls through to native on PV processing.'}}}
          ]
        }},
        {label:'No', child:{id:'out-csi-off', outcome:{type:'skip', title:'CSI Disabled', sub:'EnableCSI not set. No VolumeSnapshot created.'}}}
      ]
    }},
    {label:'PV', child:{
      id:'pv-csi-skip', title:'CSI-backed + EnableCSI?',
      sub:'Avoid duplicate with CSI BIA',
      detail:'takePVSnapshot() skips CSI-backed PVs when CSI is enabled — the CSI BIA already created a VolumeSnapshot for the PVC.',
      file:'backup/item_backupper.go:604',
      branches:[
        {label:'Yes', child:{id:'out-csi-handled', outcome:{type:'csi', title:'Handled by CSI', sub:'PV skipped here — CSI BIA already created VolumeSnapshot on PVC.'}}},
        {label:'No', child:{
          id:'native-check', title:'VolumeSnapshotter recognizes PV?',
          sub:'GetVolumeID() returns non-empty',
          detail:'Iterates VolumeSnapshotLocations. Each provider plugin calls GetVolumeID(pv). First non-empty match wins.',
          file:'backup/item_backupper.go:667-688',
          code:`for _, sl := range snapshotLocations {
  snapshotter := cache.Get(sl.Spec.Provider)
  volumeID, _ := snapshotter.GetVolumeID(pv)
  if volumeID != "" {
    snapshotter.CreateSnapshot(volumeID, zone, tags)
    break
  }
}`,
          branches:[
            {label:'Yes', child:{id:'out-native', outcome:{type:'native', title:'Native Cloud Snapshot', sub:'AWS EBS / GCP PD / Azure Disk via VolumeSnapshotter plugin.'}}},
            {label:'No', child:{id:'out-skip-final', outcome:{type:'skip', title:'No Protection', sub:'No FSB, no CSI, no native snapshotter. PV metadata backed up but data not recoverable.'}}}
          ]
        }}
      ]
    }}
  ]
};

// Wire the fallthrough references
TREE.branches[0].child.branches[1].child = LEGACY; // policy yes → no match → legacy
TREE.branches[1].child = LEGACY; // no policy → legacy

// ─── FLATTEN for lookup ───
const NODES = {};
function walk(n) {
  if (!n) return;
  NODES[n.id] = n;
  if (n.branches) n.branches.forEach(b => walk(b.child));
}
walk(TREE);

// ─── STATE: per-node toggle selection ───
const selections = {}; // nodeId → selected branch index

// ─── RENDER ───
function render() {
  document.getElementById('canvas').innerHTML = renderNode(TREE, true);
  updatePath();
}

function renderNode(node, isOnPath) {
  if (!node) return '';
  const isOutcome = !!node.outcome;
  const oc = node.outcome;

  // Outcome leaf
  if (isOutcome) {
    const cls = oc.type === 'fsb' ? 'fsb' : oc.type === 'csi' ? 'csi' : oc.type === 'dm' ? 'dm' : oc.type === 'native' ? 'native' : 'skip';
    const tagCls = cls;
    const tagText = oc.type === 'fsb' ? 'Kopia FSB' : oc.type === 'csi' ? 'CSI Snapshot' : oc.type === 'dm' ? 'Data Mover' : oc.type === 'native' ? 'Native Snap' : 'No Protection';
    return `<div class="node-wrap">
      <div class="node outcome ${cls}${isOnPath ? ' highlighted' : ' dimmed'}" id="n-${node.id}"
           onmouseenter="showTip(event,'${node.id}')" onmouseleave="hideTip()">
        <div class="node-tag ${tagCls}">${tagText}</div>
        <div class="node-title">${oc.title}</div>
        <div class="node-sub">${oc.sub}</div>
      </div>
    </div>`;
  }

  // Branch node
  const sel = selections[node.id]; // undefined = none selected
  let html = `<div class="node-wrap">
    <div class="node${isOnPath ? ' highlighted' : ' dimmed'}" id="n-${node.id}"
         onmouseenter="showTip(event,'${node.id}')" onmouseleave="hideTip()">
      <div class="node-tag q">Decision</div>
      <div class="node-title">${node.title}</div>
      <div class="node-sub">${node.sub || ''}</div>
    </div>`;

  if (node.branches && node.branches.length > 0) {
    // Toggle row
    html += `<div class="vline${isOnPath && sel !== undefined ? ' on' : ''}" style="height:8px"></div>`;
    html += `<div class="toggle-row">`;
    node.branches.forEach((b, i) => {
      const isYes = b.label === 'Yes';
      const isNo = b.label === 'No' || b.label === 'No match';
      const btnCls = isYes ? 'yes' : isNo ? 'no' : 'choice';
      const isActive = sel === i;
      html += `<button class="toggle-btn ${btnCls}${isActive ? ' active' : ''}" onclick="toggle('${node.id}',${i})">${b.label}</button>`;
    });
    html += `</div>`;

    // Connector lines down to children
    html += `<div class="vline" style="height:8px"></div>`;

    // Children
    html += `<div class="branch-wrap">`;
    node.branches.forEach((b, i) => {
      const childOnPath = isOnPath && sel === i;
      html += `<div class="branch-arm">`;
      html += renderNode(b.child, childOnPath);
      html += `</div>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function toggle(nodeId, branchIdx) {
  if (selections[nodeId] === branchIdx) {
    delete selections[nodeId]; // deselect
  } else {
    selections[nodeId] = branchIdx;
  }
  // Clear selections in branches that are no longer on the active path
  pruneSelections();
  render();
}

function pruneSelections() {
  const onPath = new Set();
  function walkPath(node) {
    if (!node || node.outcome) return;
    onPath.add(node.id);
    const sel = selections[node.id];
    if (sel !== undefined && node.branches && node.branches[sel]) {
      walkPath(node.branches[sel].child);
    }
  }
  walkPath(TREE);
  for (const id of Object.keys(selections)) {
    if (!onPath.has(id)) delete selections[id];
  }
}

function updatePath() {
  // Build path description
  const parts = [];
  function walkPath(node) {
    if (!node) return;
    if (node.outcome) {
      const oc = node.outcome;
      parts.push(oc.title);
      return;
    }
    const sel = selections[node.id];
    if (sel !== undefined && node.branches && node.branches[sel]) {
      parts.push(node.title + ' → ' + node.branches[sel].label);
      walkPath(node.branches[sel].child);
    }
  }
  walkPath(TREE);
  const label = document.getElementById('pathLabel');
  if (parts.length === 0) {
    label.textContent = 'Toggle switches to trace a path';
  } else {
    label.textContent = parts.join('  →  ');
  }
}

function resetAll() {
  for (const k of Object.keys(selections)) delete selections[k];
  render();
}

// ─── TOOLTIP ───
function showTip(evt, nodeId) {
  const node = NODES[nodeId];
  if (!node) return;
  const tip = document.getElementById('tooltip');
  let html = '';

  if (node.outcome) {
    html = `<h4>${node.outcome.title}</h4><p>${node.outcome.sub}</p>`;
  } else {
    html = `<h4>${node.title}</h4>`;
    if (node.detail) html += `<p>${node.detail}</p>`;
    if (node.file) html += `<div class="tt-file">${node.file}</div>`;
    if (node.code) html += `<div class="tt-code">${esc(node.code)}</div>`;
  }

  tip.innerHTML = html;
  tip.classList.add('show');

  // Position near cursor
  const x = Math.min(evt.clientX + 16, window.innerWidth - 380);
  const y = Math.min(evt.clientY + 16, window.innerHeight - tip.offsetHeight - 20);
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

function hideTip() {
  document.getElementById('tooltip').classList.remove('show');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

render();
</script>
</body>
</html>
